services:
  app:
    build: .
    command: tail -f /dev/null
    environment:
      RAILS_ENV: development
      DATABASE_URL: mysql2://root:${MYSQL_ROOT_PASSWORD}@db:3306/reimplementation?
      CACHE_STORE: redis://redis:6380/0
    ports:
      - "3002:3002"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - expertiza-mysql:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d

  redis:
    image: redis:latest
    ports:
      - "6380:6380"
    volumes:
      - expertiza-redis:/var/lib/redis/data

volumes:
  expertiza-mysql:
  expertiza-redis:

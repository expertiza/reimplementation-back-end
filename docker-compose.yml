x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    profiles: ["dev"]
    build: .
    environment:
      RAILS_ENV: ${RAILS_ENV}
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      CACHE_STORE: ${CACHE_STORE}
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - expertiza-dev-pids:/app/tmp/pids
      - expertiza-dev-logs:/app/log
      - expertiza-dev-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public
      - private
    logging: *default-logging

  app-prod:
    profiles: ["prod"]
    image: ${BACKEND_IMAGE:-ghcr.io/expertiza/reimplementation-back-end}:${BACKEND_IMAGE_TAG:-latest}
    environment:
      RAILS_ENV: production
      DATABASE_URL: ${PROD_DATABASE_URL:-}
      CACHE_STORE: ${CACHE_STORE}
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - public
      - private
    logging: *default-logging

  db:
    profiles: ["dev"]
    # Keep this version aligned with MariaDB in .github/workflows/main.yml
    image: mariadb:10.11.15
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reimplementation_development}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - expertiza-mariadb:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - private
    logging: *default-logging

  redis:
    image: redis:8.10.1
    volumes:
      - expertiza-redis:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--port", "6380", "--maxmemory", "100mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    logging: *default-logging

volumes:
  expertiza-mariadb:
  expertiza-redis:
  expertiza-dev-pids:
  expertiza-dev-logs:
  expertiza-dev-storage:

networks:
  public:
  private:

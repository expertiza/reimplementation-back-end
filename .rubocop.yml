---
inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: disable
  SuggestExtensions: false

Style/ClassAndModuleChildren:
  Enabled: false

# Disable Style/Documentation for missing top-level documentation comments
# See https://rubocop.readthedocs.io/en/latest/cops_style/#styledocumentation
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# Indentation/alignment is not enforced for this project.
Layout/ArgumentAlignment:
  Enabled: false

Layout/ClosingParenthesisIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Metrics/BlockLength:
  Max: 120
  Exclude:
    - 'db/**/*.rb'

Metrics/MethodLength:
    Max: 20
    Exclude:
      - 'db/**/*.rb'

Metrics/AbcSize:
  Max: 20
  Exclude:
    - 'db/**/*.rb'
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
  Exclude:
      - 'db/**/*.rb'

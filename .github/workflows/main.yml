name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    env:
      DATABASE_URL: mysql2://root:expertiza@127.0.0.1:3306/expertiza_test
      RAILS_ENV: test
      
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: expertiza
          MYSQL_DATABASE: expertiza_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3
      
      - name: Clear Ruby cache
        run: |
          rm -rf ~/.ruby-version
          rm -rf ~/.rbenv
          rm -rf ~/.rvm
          rm -rf /usr/local/rvm
          rm -rf /opt/ruby

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.5
          bundler-cache: false

      - name: Check Ruby Version
        run: |
          ruby -v
          which ruby
          gem env
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-traditional
          
      - name: Install Ruby dependencies
        run: |
          gem update --system
          gem install bundler:2.4.7
          bundle config set --local deployment 'false'
          bundle config set --local without ''
          bundle config set --local force_ruby_platform true
          bundle install --verbose
          
      - name: Setup database
        run: |
          bundle exec rails db:create RAILS_ENV=test
          bundle exec rails db:schema:load RAILS_ENV=test
          
      - name: Set up code coverage
        run: |
          echo "SimpleCov coverage reporting is configured in spec_helper.rb"

      - name: Run full RSpec suite
        shell: bash
        run: |
          set -o pipefail
          bundle exec rspec 2>&1 | tee rspec_results.txt

      - name: Prepare CI report
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "## CI Test & Coverage Report"
            echo ""
            echo "### RSpec Results"

            if [ ! -f rspec_results.txt ]; then
              echo "RSpec did not run or produce a results file. Check the CI logs."
            else
              result=$(grep -E '^[0-9]+ examples?, [0-9]+ failures?' rspec_results.txt | tail -1 || true)

              if [ -n "$result" ]; then
                echo "$result"
              else
                echo "RSpec did not complete successfully. Check the CI logs."
              fi

              if grep -q "^Failed examples:" rspec_results.txt; then
                echo ""
                echo "#### Failing examples"
                echo '```text'
                grep "^rspec " rspec_results.txt | head -20 || true
                echo '```'
              fi
            fi

            echo ""
            echo "### Coverage"

            if [ -f coverage/coverage.json ]; then
              if coverage=$(ruby -rjson -e '
                data = JSON.parse(File.read("coverage/coverage.json"))
                lines = data.fetch("coverage").values.flat_map do |file|
                  file.fetch("lines", []).compact
                end
                total = lines.length
                covered = lines.count { |hits| hits.to_i > 0 }
                percentage = total.zero? ? 0.0 : covered * 100.0 / total
                puts format("%.2f%% (%d/%d lines)", percentage, covered, total)
              ' 2>/dev/null); then
                echo "Line coverage: $coverage"
              else
                echo "Coverage data could not be summarized. See coverage artifacts."
              fi
            else
              echo "Coverage report unavailable."
            fi
          } | tee rspec_summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rspec-summary
          path: rspec_summary.txt
          if-no-files-found: warn

      - name: Check coverage report
        if: always()
        run: |
          if [ -f coverage/coverage.json ]; then
            echo "Coverage JSON report generated successfully"

            ruby -rjson -e '
              data = JSON.parse(File.read("coverage/coverage.json"))

              lines = data.fetch("coverage").values.flat_map do |file|
                file.fetch("lines", []).compact
              end

              total = lines.length
              covered = lines.count { |hits| hits.to_i > 0 }
              percentage = total.zero? ? 0.0 : (covered * 100.0 / total)

              puts "Coverage: %.2f%% (%d/%d lines)" % [percentage, covered, total]
            '
          else
            echo "::warning::coverage/coverage.json was not generated"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-artifacts
          path: coverage/
          if-no-files-found: warn
          
  publish_code_coverage:
    needs: test  # Ensures this job runs after the test job
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only run when there's a push to main branch

    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage-artifacts
          path: coverage/

      - name: Upload code-coverage report to qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.CC_TEST_REPORTER_ID }}
          files: coverage/coverage.json

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: expertiza-backend:latest

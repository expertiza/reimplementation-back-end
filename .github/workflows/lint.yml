name: Lint

on: [workflow_dispatch, pull_request]

permissions:
  contents: read

jobs:
  misspell:
    name: Check spelling all files in commit with misspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install
        run: |
          curl -fsSL -o /tmp/misspell.tar.gz https://github.com/client9/misspell/releases/download/v0.3.4/misspell_0.3.4_linux_64bit.tar.gz
          echo "afd95caf1eecc72ff382791e00b3b11523a20b0579d95e2295c1c043688743d5  /tmp/misspell.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/misspell.tar.gz
          mv /tmp/misspell .
      - name: Misspell
        run: git ls-files --empty-directory | xargs ./misspell -i 'aircrafts,devels,invertions' -error

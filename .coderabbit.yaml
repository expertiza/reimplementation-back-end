# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: >
    Summarize the changes and highlight important correctness,
    security, performance, and maintainability concerns.
    Focus on issues that require understanding application behavior.
    Avoid repeating mechanical PR checks already handled by
    Danger, RuboCop, and CI where those checks run.
    For fork PRs, where Danger is skipped, preserve warnings
    for newly introduced debugging statements.
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  labeling_instructions:
    - label: "api"
      instructions: "Apply when controllers, routes, request specs, serializers, or Swagger docs change."
    - label: "database"
      instructions: "Apply when models, migrations, schema, associations, or data integrity rules change."
    - label: "workflow"
      instructions: "Apply when GitHub Actions, CI, bot behavior, or automation files change."
    - label: "security"
      instructions: "Apply when authentication, authorization, secrets handling, or workflow permissions change."
    - label: "tests"
      instructions: "Apply when RSpec coverage or test helpers are added or modified."

  path_filters:
    - "!coverage/**"
    - "!tmp/**"
    - "!log/**"
    - "!storage/**"
    - "!public/assets/**"
    - "!vendor/bundle/**"
    - "!*.log"
    - "!*.ibd"

  path_instructions:
    - path: "app/controllers/**/*.rb"
      instructions: |
        Review authorization, strong parameters, HTTP status codes, and response shape consistency.
        Flag N+1 queries, missing request-spec coverage, and behavior changes not reflected in Swagger docs.

    - path: "app/models/**/*.rb"
      instructions: |
        Focus on associations, validations, callbacks, transactions, STI and polymorphic behavior,
        foreign keys, data integrity, and query efficiency.

    - path: "app/serializers/**/*.rb"
      instructions: |
        Check backward compatibility of response payloads and accidental exposure of internal or sensitive fields.

    - path: "app/mailers/**/*.rb"
      instructions: |
        Check mailer/template consistency, recipient safety, and avoid debug output or sensitive data leaks.

    - path: "config/routes.rb"
      instructions: |
        Flag duplicate or shadowed routes, surprising non-RESTful patterns, and route changes without matching request specs.

    - path: "db/migrate/**/*.rb"
      instructions: |
        Review for reversibility, null constraints, indexes, foreign keys, destructive data changes,
        and alignment with db/schema.rb and affected model behavior.

    - path: "db/schema.rb"
      instructions: |
        If schema changes, verify there is a corresponding migration and that indexes, constraints,
        and associated tests stay aligned.

    - path: "spec/models/**/*.rb"
      instructions: |
        Review whether model specs meaningfully cover validations,
        associations, callbacks, and important edge cases.
        Focus on test effectiveness and whether assertions verify
        the intended behavior.

    - path: "spec/controllers/**/*.rb"
      instructions: |
        Review whether controller specs cover authorization,
        invalid input, error handling, response status codes,
        and important behavior changes.

    - path: "spec/requests/**/*.rb"
      instructions: |
        Review authentication, authorization, request validation,
        response payloads, failure cases, and edge cases.
        Check that tests cover intended API behavior and remain
        consistent with Swagger documentation.

    - path: "swagger/**/*.yml"
      instructions: |
        Check for drift between documented endpoints and controller or request-spec behavior.

    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        Review GitHub Actions for unsafe pull_request_target usage, overly broad permissions, secrets exposure,
        skipped-job logic, artifact passing, and brittle PR-comment behavior.

    - path: "Dangerfile"
      instructions: |
        Review changes to Danger rules for correctness and unintended
        policy regressions. Danger remains responsible for deterministic
        PR policy enforcement. Flag changes that weaken existing checks
        without a documented justification.

    - path: "Gemfile"
      instructions: |
        Non-maintainer Gemfile changes should be scrutinized closely. Prefer existing gems when possible
        and call out dependency additions or lockfile churn without strong justification.

    - path: "Gemfile.lock"
      instructions: |
        Flag lockfile-only churn, IDE-generated noise, or dependency graph changes that are not explained in the PR.

    - path: "*.md"
      instructions: |
        Non-maintainer documentation changes should be questioned unless they are clearly part of the intended work.

    - path: "*.yml"
      instructions: |
        Treat YAML changes as sensitive, especially workflow, environment, and configuration files.
        Call out changes that look unrelated to the stated task.

    - path: ".rspec"
      instructions: |
        Changing `.rspec` is sensitive. Flag it unless the PR clearly justifies altering the global test runner behavior.

    - path: "config.ru"
      instructions: |
        Treat Rack entrypoint changes as sensitive and require a clear reason in the PR description.

    - path: "setup.sh"
      instructions: |
        Treat setup script changes as sensitive and require a clear reason in the PR description.

    - path: "vendor/**"
      instructions: |
        Flag vendor directory changes unless the PR clearly explains why vendored files must change.

    - path: "spec/factories/**"
      instructions: |
        Non-maintainer changes to factories should be scrutinized. Ensure they are necessary and do not hide weak tests.

    - path: "Dockerfile"
      instructions: |
        Review base image choices, layer ordering, cleanup, and security-sensitive package installation.

    - path: "bin/*"
      instructions: |
        Check shell safety, idempotence, and environment assumptions for developer setup scripts.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "WIP"
      - "DRAFT"
      - "[WIP]"

  pre_merge_checks:
    override_requested_reviewers_only: false
    title:
      mode: "warning"
      requirements: "Use a concise, imperative title that names the subsystem changed."
    custom_checks:
      - name: "behavior-change-needs-tests"
        mode: "warning"
        instructions: |
          Review whether behavioral changes have meaningful tests
          covering the intended functionality and important edge cases.
          Focus on test effectiveness rather than simply checking
          whether test files were modified.

      - name: "workflow-security"
        mode: "warning"
        instructions: |
          Warn on GitHub Actions changes that use pull_request_target
          with PR-head checkout, overbroad write permissions,
          or token and secrets exposure patterns.

      - name: "config-and-setup-scrutiny"
        mode: "warning"
        instructions: |
          Review configuration and setup changes for security risks,
          compatibility issues, and unintended behavioral changes.
          Avoid repeating Danger's file-change notifications.

      - name: "fork-pr-debug-code"
        mode: "warning"
        instructions: |
          Apply only when the PR head repository differs from
          the base repository (fork PR).
          For same-repository PRs, pass as not applicable because
          Danger already checks for debugging statements.

          For fork PRs, warn when newly added executable code
          contains leftover debugging statements such as puts,
          print, binding.pry, debugger, or console.log.

          Ignore intentional application output, production
          logging, documentation, and quoted examples.
          Pass when no new debugging statements are introduced.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 300000
    rubocop:
      enabled: true
    brakeman:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true
  allow_non_org_members: true
  art: false

knowledge_base:
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "CODERABBIT_GUIDELINES.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
